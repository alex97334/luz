<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para alguien increíble</title>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Estilos CSS mejorados */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .card {
            position: relative;
            width: 400px;
            height: 650px;
            background: rgba(40, 30, 80, 0.3);
            border-radius: 25px;
            box-shadow: 0 0 40px rgba(178, 102, 255, 0.6),
                        inset 0 0 20px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        h1 {
            color: #ff9ec6;
            margin-top: 20px;
            font-size: 42px;
            text-shadow: 0 0 15px rgba(255, 158, 198, 0.7),
                         0 0 5px rgba(255, 255, 255, 0.5);
            font-family: 'Parisienne', cursive;
            z-index: 20;
            letter-spacing: 1px;
        }

        p {
            color: #c2e9fb;
            font-size: 20px;
            margin-top: 15px;
            z-index: 20;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(194, 233, 251, 0.3);
        }

        .photo-container {
            width: 240px;
            height: 200px;
            margin: 25px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6),
                        inset 0 0 20px rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.5);
            z-index: 20;
            position: relative;
            transition: transform 0.5s, box-shadow 0.5s;
        }

        .photo-container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ccff, #ffcc00);
            background-size: 400%;
            z-index: -1;
            border-radius: 25px;
            opacity: 0;
            transition: 0.5s;
            animation: animate 20s linear infinite;
        }

        .photo-container:hover::before {
            opacity: 1;
            filter: blur(10px);
        }

        .photo-container:hover {
            transform: scale(1.03);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
        }

        @keyframes animate {
            0% { background-position: 0 0; }
            50% { background-position: 300% 0; }
            100% { background-position: 0 0; }
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .photo-container:hover img {
            transform: scale(1.05);
        }

        .audio-container {
            width: 85%;
            margin-top: 30px;
            background: rgba(179, 229, 252, 0.15);
            border-radius: 60px;
            padding: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 20;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4),
                        inset 0 0 15px rgba(255, 255, 255, 0.1);
            transition: all 0.5s;
        }

        .audio-container:hover {
            box-shadow: 0 0 35px rgba(138, 43, 226, 0.7);
            transform: scale(1.02);
        }

        audio {
            width: 100%;
            outline: none;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        audio::-webkit-media-controls-panel {
            background: rgba(40, 30, 80, 0.7);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        audio::-webkit-media-controls-play-button,
        audio::-webkit-media-controls-mute-button {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .audio-label {
            margin-top: 10px;
            font-size: 16px;
            color: #b3e5fc;
            font-style: italic;
            text-shadow: 0 0 5px rgba(179, 229, 252, 0.3);
        }

        /* Elementos decorativos mejorados */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            z-index: 1;
            filter: drop-shadow(0 0 5px white);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .firefly {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #fffacd;
            box-shadow: 0 0 15px 3px #fffacd;
            animation: fly var(--duration) infinite linear;
            z-index: 5;
            filter: blur(0.5px);
        }

        @keyframes fly {
            0% {
                transform: translate(0, 0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y));
                opacity: 0;
            }
        }

        .moon {
            position: absolute;
            top: 10%;
            right: 10%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fff 0%, #f5f5dc 50%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px #fffacd;
            z-index: 2;
            animation: moonGlow 4s infinite alternate;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 40px #fffacd; }
            100% { box-shadow: 0 0 60px #fffacd; }
        }

        .shooting-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            z-index: 1;
            animation: shoot var(--duration) linear infinite;
            opacity: 0;
        }

        @keyframes shoot {
            0% {
                transform: translate(var(--start-x), var(--start-y));
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--end-x), var(--end-y));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Elementos decorativos del fondo -->
    <div class="moon"></div>
    
    <!-- Tarjeta principal -->
    <div class="card">
        <h1>💌Para ti Luz..🌹</h1>
        <p>"Eres de esas personas que con solo existir, hacen que todo tenga más color 🥰."</p>
        
        <!-- Contenedor de la foto de flores con borde especial -->
        <div class="photo-container">
            <img src="206lo.jpg" alt="Hermosas flores">
        </div>
        
        <!-- Reproductor de audio de gato con diseño mejorado -->
        <div class="audio-container">
            <audio controls>
                <source src="besos.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
            <div class="audio-label">Ronroneo de gato feliz</div>
        </div>
    </div>

    <script>
        // Crear estrellas mejoradas
        function createStars() {
            const count = 200;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 4 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.setProperty('--duration', `${Math.random() * 5 + 3}s`);
                star.style.opacity = Math.random() * 0.8 + 0.2;
                document.body.appendChild(star);
            }
        }

        // Crear luciérnagas mejoradas
        function createFireflies() {
            const count = 20;
            for (let i = 0; i < count; i++) {
                const firefly = document.createElement('div');
                firefly.className = 'firefly';
                const size = Math.random() * 4 + 3;
                firefly.style.width = `${size}px`;
                firefly.style.height = `${size}px`;
                firefly.style.left = `${Math.random() * 100}vw`;
                firefly.style.top = `${Math.random() * 100}vh`;
                
                const duration = Math.random() * 20 + 15;
                firefly.style.setProperty('--duration', `${duration}s`);
                firefly.style.setProperty('--end-x', `${Math.random() * 300 - 150}px`);
                firefly.style.setProperty('--end-y', `${Math.random() * 300 - 150}px`);
                
                firefly.style.opacity = Math.random() * 0.7 + 0.3;
                document.body.appendChild(firefly);
            }
        }

        // Crear estrellas fugaces
        function createShootingStars() {
            const count = 5;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.width = `${Math.random() * 100 + 50}px`;
                star.style.setProperty('--duration', `${Math.random() * 10 + 15}s`);
                star.style.setProperty('--start-x', `${Math.random() * 100 + 50}vw`);
                star.style.setProperty('--start-y', `${Math.random() * 30}vh`);
                star.style.setProperty('--end-x', `${Math.random() * -100 - 50}vw`);
                star.style.setProperty('--end-y', `${Math.random() * 100 + 50}vh`);
                star.style.animationDelay = `${Math.random() * 20}s`;
                document.body.appendChild(star);
            }
        }

        // Inicializar elementos
        window.onload = function() {
            createStars();
            createFireflies();
            createShootingStars();
        };
    </script>
</body>
</html>
